# Development topology — ARCHITECTURE.md §19.1, ADR-008.
#
#   docker compose up -d     postgres, redis, api, worker
#
# Deviation from the §19.1 sketch, recorded deliberately: that sketch uses
# `env_file: .env` alone. `.env` is gitignored, so a fresh clone could not even
# run `docker compose config`. Service-internal connection strings are set here
# instead — they are the only values that differ between host and container —
# and `.env` remains an optional overlay for real API keys.

name: numeraire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: numeraire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numeraire_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Default matches ARCHITECTURE.MD §19.1. Override POSTGRES_HOST_PORT when the
      # host already runs Postgres on 5432 — Docker publishes the port without
      # error in that case, but connections reach the host's server, not this one.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d numeraire']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      target: development
    command: npm run dev:api
    environment: &app_environment
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Service names, not localhost: these are resolved on the compose network.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-numeraire_dev}@postgres:5432/numeraire
      REDIS_URL: redis://redis:6379
      # Development placeholder, never a deployment secret. Override in .env.
      JWT_SECRET: ${JWT_SECRET:-numeraire_dev_only_secret_min_32_characters}
      # Mock by default so a clone runs with no API key anywhere.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    env_file:
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    volumes:
      - ./src:/app/src

  worker:
    build:
      context: .
      target: development
    command: npm run dev:worker
    environment: *app_environment
    env_file:
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata: {}
  redisdata: {}
