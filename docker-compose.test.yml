# Ephemeral test dependencies — DEV_PIPELINE.md Phase 0 task 0.5.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml port postgres 5432
#
# Two deliberate differences from docker-compose.yml:
#
#   1. No fixed host ports. Each `ports` entry names the container port only,
#      so Docker assigns a free host port. The dev stack, a second worktree, or
#      a CI runner can hold 5432 without this stack failing to start.
#   2. No volumes. Postgres runs on tmpfs and Redis with persistence disabled,
#      so `down` leaves nothing behind and each run starts from an empty state.
#
# The project name is distinct so this stack never adopts or removes dev
# containers, networks, or volumes.

name: numeraire-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: numeraire_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: numeraire_test
      # Safe only because the data is thrown away with the container.
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >-
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d numeraire_test']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    ports:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
