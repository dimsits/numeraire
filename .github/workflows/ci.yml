# CI — ARCHITECTURE.MD §19.3, DEV_PIPELINE.MD task 0.8.
#
# Every step below invokes a script from package.json. Nothing is reimplemented
# here, so a check cannot pass locally and fail in CI (or the reverse) because
# the two drifted. The steps are listed individually rather than as a single
# `npm run verify:full` only so a failure names itself in the job summary; the
# order is exactly verify -> verify:full:
#
#   verify:      typecheck -> lint -> format:check -> test:unit -> boundaries
#   verify:full: verify -> db:migrate -> test:integration -> test:api -> coverage:check
#
# Keep this list and the `verify` / `verify:full` scripts in step.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.test.yml: ephemeral, thrown away with the job.
  DATABASE_URL: postgres://postgres:numeraire_test@localhost:5432/numeraire_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci_only_secret_value_at_least_32_characters_long
  AI_PROVIDER: mock
  NODE_ENV: test

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: numeraire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: numeraire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numeraire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── verify ──────────────────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Boundaries (dependency-cruiser + invariants)
        run: npm run boundaries

      # ── verify:full ─────────────────────────────────────────────────────
      # Phase 0 has no migrations. drizzle/meta/_journal.json is a real, empty
      # journal, so this connects, ensures the bookkeeping table, and applies
      # zero migrations. It is not skipped and not stubbed: if the database is
      # unreachable or a migration fails, this step fails.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: API tests
        run: npm run test:api

      - name: Coverage gate
        run: npm run coverage:check

      - name: Build
        run: npm run build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: numeraire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Production image fails loudly without DATABASE_URL
        run: |
          set +e
          output=$(docker run --rm \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci_only_secret_value_at_least_32_characters_long \
            -e AI_PROVIDER=mock \
            numeraire:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "expected a nonzero exit"; exit 1; }
          echo "$output" | grep -q DATABASE_URL || { echo "expected DATABASE_URL to be named"; exit 1; }
